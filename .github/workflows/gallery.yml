# After a merge, and once a day: keeps each look's download file and
# like page on GitHub (scripts/sync.py), then rebuilds index.json with
# their counts. Its commit uses GITHUB_TOKEN, so it starts no other run.
name: Gallery

on:
  push:
    branches: [main]
    paths: ["looks/**", "schema/**", "scripts/**"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  discussions: write
  actions: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  previews:
    # The latest KiwiDesk release draws each look's preview.png
    # (scripts/previews.py); one too old for the verb draws none.
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Get KiwiDesk
        run: |
          gh release download --repo KiwiCanopy/KiwiDesk \
            --pattern 'KiwiDesk-*.zip' --dir "$RUNNER_TEMP/release"
          ditto -x -k "$RUNNER_TEMP"/release/KiwiDesk-*.zip "$RUNNER_TEMP/app"
      - run: python3 scripts/previews.py "$RUNNER_TEMP/app/KiwiDesk.app/Contents/MacOS/KiwiDesk"
      - name: Commit when changed
        run: |
          [ -z "$(git status --porcelain -- looks)" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A looks
          git commit -m "chore: draw look previews"
          git pull --rebase -q
          git push

  gallery:
    # After the previews, so the index names them; a failed preview
    # run never holds a look out of the index.
    needs: previews
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync files and likes
        # A transient API error must not hold a merged look out of the
        # index: it builds with the last saved counts instead.
        continue-on-error: true
        run: python3 scripts/sync.py
      - run: python3 scripts/build_index.py
      - name: Commit when changed
        run: |
          [ -z "$(git status --porcelain -- index.json stats.json)" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json stats.json
          git commit -m "chore: rebuild index.json"
          git pull --rebase -q
          git push
      - name: Keep the schedules alive
        # GitHub disables scheduled workflows after 60 quiet days;
        # re-enabling them daily resets that.
        if: github.event_name == 'schedule'
        run: |
          gh workflow enable gallery.yml
          gh workflow enable deploy.yml
