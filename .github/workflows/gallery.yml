# After a merge, and once a day: keeps each look's download file and
# like page on GitHub (scripts/sync.py), then rebuilds index.json with
# their counts. Its commit uses GITHUB_TOKEN, so it starts no other run.
name: Gallery

on:
  push:
    branches: [main]
    paths: ["looks/**", "schema/**", "scripts/**"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  gallery:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/sync.py
      - run: python3 scripts/build_index.py
      - name: Commit when changed
        run: |
          git diff --quiet -- index.json stats.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json stats.json
          git commit -m "chore: rebuild index.json"
          git push
