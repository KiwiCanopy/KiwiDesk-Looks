name: Submit a look
description: Share a KiwiDesk look with everyone. A bot checks it and opens a pull request.
title: "Look: "
labels: [submit-look]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing! In KiwiDesk, choose **Save current look as…**, then right-click the saved look and choose **Export…**. Open the file in a text editor and paste all of it below.

        To update a look you shared before, submit it again under the same name from this account.
  - type: textarea
    id: look
    attributes:
      label: Look file
      description: The whole exported file, starting with {.
      render: json
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Your name as the author
      description: Shown on the gallery card. Leave empty to use your GitHub name.
  - type: input
    id: based_on
    attributes:
      label: Based on
      description: If your look started from someone else's, name it here, e.g. "Dusk by Anna", or paste its gallery link. If your look started from someone else's and still matches about half of its settings, the app credits them. Remove this if you rebuilt it yourself.
  - type: checkboxes
    id: tags
    attributes:
      label: Tags
      description: Pick one to five that describe your look. Tags like dark, glass or rounded are added automatically from the file.
      options:
        - label: mono
        - label: serif
        - label: script
        - label: pastel
        - label: vibrant
        - label: warm
        - label: cool
        - label: minimal
        - label: calm
        - label: playful
        - label: retro
        - label: neon
        - label: high-contrast
  - type: input
    id: description
    attributes:
      label: One-line description
      description: Up to 140 characters, no links.
    validations:
      required: true
  - type: input
    id: keywords
    attributes:
      label: Keywords
      description: Optional, up to five words people might search for, separated by commas (e.g. lavender, soft). Lower-case letters, digits and hyphens.
  - type: dropdown
    id: inspired_by
    attributes:
      label: Inspired by
      description: Optional. Only if your colors follow a known palette. Please don't call your look an official port or use its name in your look's name.
      options:
        - gruvbox
        - nord
        - catppuccin
        - dracula
        - solarized
        - tokyo-night
        - rose-pine
        - everforest
  - type: input
    id: font_url
    attributes:
      label: Font download link
      description: Only if your look uses a font that doesn't ship with macOS. An https link where people can get it.
  - type: input
    id: wallpaper
    attributes:
      label: Wallpaper
      description: Optional. The wallpaper in your screenshot, with its artist if it has one, e.g. "Sequoia Dark (macOS)" or "Fog Valley by Anna". The gallery names it and never hosts the picture.
  - type: input
    id: wallpaper_url
    attributes:
      label: Wallpaper link
      description: Optional, and only with a wallpaper name above. An https link to the page where people can get it, from its artist or a photo site. Leave it empty for a wallpaper that ships with macOS.
  - type: input
    id: version
    attributes:
      label: KiwiDesk version
      description: KiwiDesk ▸ About, e.g. 4.1.0.
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Optional. Paste or drag a PNG here (2 MB at most). Without one, the gallery draws a preview of your look. Check that it shows nothing private, like notes, mail, chats or names.
  - type: checkboxes
    id: consent
    attributes:
      label: Before you send
      options:
        - label: I made this look, or I credited the look it started from above.
          required: true
        - label: I share this look under CC BY 4.0. If I remove it later, copies people already downloaded stay theirs to use.
          required: true
        - label: My screenshot, if any, shows nothing private and nothing I may not share.
          required: true
